name: Pulse
options:
  bundleIdPrefix: com.koki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
    resources:
      - path: Pulse/city_drift.mp3
      - path: Pulse/golden_hour.mp3
      - path: Pulse/window_film.mp3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koki.pulse
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Pulse records two-second moments when your daily prompts arrive.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Pulse records ambient audio for your two-second moments.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Pulse can save your finished daily vlog to your photo library.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
